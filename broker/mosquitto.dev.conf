# Local development broker. Same protocol version and topic behaviour as the
# deployed broker, with no auth and no TLS so `npm run broker` is one command.
#
# Never expose this config: it accepts anonymous connections.

listener 1883 127.0.0.1
protocol mqtt

allow_anonymous true
persistence true
persistence_location ./.broker-data/

# Keep retained presence available so workers survive a broker restart.
retain_available true
autosave_interval 60

log_type all
connection_messages true
