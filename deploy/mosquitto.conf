# Deployed broker for Railway. TLS terminates at Railway's TCP proxy, so the
# listener here is plain MQTT on 1883 behind the proxy.
#
# If your proxy does not terminate TLS, enable the 8883 listener below and
# supply certs through /mosquitto/certs.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
retain_available true

max_keepalive 120
max_inflight_messages 20

# WebSocket listener. Pair this with Railway's HTTP domain (which terminates TLS
# at the edge), so clients use wss://<domain>/mqtt on port 443. This is the more
# reliable wiring where raw TCP proxies are blocked or flaky.
listener 9001
protocol websockets

# Direct TLS WebSocket, for a TCP proxy or a plain host. Needs certs mounted at
# /mosquitto/certs; clients then use wss://host:9443/mqtt.
# listener 9443
# protocol websockets
# certfile /mosquitto/certs/fullchain.pem
# keyfile /mosquitto/certs/privkey.pem

# listener 8883
# protocol mqtt
# certfile /mosquitto/certs/fullchain.pem
# keyfile /mosquitto/certs/privkey.pem

log_dest stdout
log_type notice
connection_messages true
