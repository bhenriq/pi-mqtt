# Broker for the public deployment.
#
# Two reachable transports:
#   1883  plain MQTT      -> expose with a Railway TCP proxy (no TLS!)
#   9001  websockets      -> expose with a Railway HTTP domain; the edge
#                            terminates TLS, so clients use wss://host/mqtt
#
# Prefer the HTTP/WebSocket route: it rides the same infrastructure as web
# traffic and does not depend on long-lived raw TCP connections surviving a
# proxy. Direct TLS listeners (8883 / 9443) are commented out below.

# Drop privileges: the entrypoint chowns config and data before exec.
user mosquitto

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
retain_available true

max_keepalive 120
max_inflight_messages 20

log_dest stdout
log_type notice
connection_messages true

listener 1883
protocol mqtt

listener 9001
protocol websockets

# listener 9443
# protocol websockets
# certfile /mosquitto/certs/fullchain.pem
# keyfile /mosquitto/certs/privkey.pem

# listener 8883
# protocol mqtt
# certfile /mosquitto/certs/fullchain.pem
# keyfile /mosquitto/certs/privkey.pem
