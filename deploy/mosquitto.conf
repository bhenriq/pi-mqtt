# Deployed broker for Railway. TLS terminates at Railway's TCP proxy, so the
# listener here is plain MQTT on 1883 behind the proxy.
#
# If your proxy does not terminate TLS, enable the 8883 listener below and
# supply certs through /mosquitto/certs.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
retain_available true

max_keepalive 120
max_inflight_messages 20

# listener 8883
# protocol mqtt
# certfile /mosquitto/certs/fullchain.pem
# keyfile /mosquitto/certs/privkey.pem

log_dest stdout
log_type notice
connection_messages true
